[project]
name = "research-agent"
version = "0.1.0"
description = "CLI tool that searches Semantic Scholar + OpenAlex + arXiv and uses Claude to filter, analyze, and produce a verified research literature report."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
view = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-view = "research_agent.view_cli:main"
research-agent-api = "research_agent.api_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
